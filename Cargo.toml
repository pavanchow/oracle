[package]
name = "oracle"
version = "0.1.0"
edition = "2021"
description = "Attack-path query engine over identity and network graphs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
petgraph = "0.6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
